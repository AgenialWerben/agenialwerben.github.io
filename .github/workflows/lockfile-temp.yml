name: TFOC lockfile generation (temporary)
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Resolve dependencies, no install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Publish lock checksum and public base64 (temporary)
        run: |
          sha256sum package-lock.json
          echo 'LOCKFILE_DATA_START'
          base64 --wrap=76 package-lock.json
          echo 'LOCKFILE_DATA_END'
